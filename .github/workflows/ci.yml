name: ci

on:
  push:

# A newer push to the same branch cancels the older run, so we don't waste minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # Python version comes from backend/.python-version, so CI matches local.
      # --locked fails if uv.lock is out of date, which catches forgotten lock updates.
      - run: uv sync --locked

      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests
      - run: uv run pytest

  # Builds the image and calls /health, so a broken Dockerfile fails here
  # and not in the Cloud Run deploy (PR 18).
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: docker build -t nextbracket-api backend

      - name: Smoke test /health
        run: |
          docker run -d --name api -p 8080:8080 nextbracket-api
          for i in $(seq 1 20); do
            curl -fsS localhost:8080/health && exit 0
            sleep 1
          done
          echo "API did not become healthy"
          docker logs api
          exit 1
